<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
  <title>Faustus</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 0.738L4.674 25.559L13.004 28.992L13.004 24.798L9.229 24.798L9.229 19.644L16 12.094L22.772 19.644L22.772 24.798L17.678 24.798L13.4 31.264L27.326 25.559Z' fill='%23e06c75'/%3E%3Cg fill='%23e06c75' opacity='.62'%3E%3Cpath d='M5.993 5.022L0.839 13.292L6.233 18.985L9.049 13.172L4.555 11.434Z'/%3E%3Cpath d='M26.008 5.022L31.161 13.292L25.768 18.985L22.952 13.172L27.446 11.434Z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Stop iOS / Android auto-linkifying numbers (phone/date/address) inside
       email bodies: it wrapped random digits in <a href="tel:…"> with browser
       default styling that matched no theme. -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <script nonce="{{CSP_NONCE}}">
  window._odysseusLoadTime = Date.now();
  /*
   * Before the first paint.
   *
   * The shell applies the theme itself the moment its bundle runs
   * (studio/src/shell/theme.ts and shell/appearance.ts), but that is one
   * network round trip away. Without these few lines the page flashes the
   * system palette and then swaps — worst on a dark theme in a light OS.
   * Everything here is a mirror of what those two modules do on boot; they
   * remain the source of truth and overwrite it a moment later.
   */
  (function () {
    var html = document.documentElement;
    var bg = '';
    try {
      var choice = localStorage.getItem('faustus_studio_theme');
      if (choice === 'light' || choice === 'dark') html.setAttribute('data-theme', choice);
    } catch (e) { /* a private window just gets the system palette */ }
    try {
      var t = JSON.parse(localStorage.getItem('odysseus-theme') || 'null');
      var own = !t || !t.colors || t.name === 'studio';
      html.setAttribute('data-theme-source', own ? 'studio' : 'faustus');
      if (!own) {
        var c = t.colors;
        html.style.setProperty('--bg', c.bg);
        html.style.setProperty('--fg', c.fg);
        html.style.setProperty('--panel', c.panel);
        html.style.setProperty('--border', c.border);
        if (c.red) html.style.setProperty('--red', c.red);
        bg = c.bg;
        // A palette decides light or dark by its own background, same rule
        // as isLight() in appearance.ts.
        var hex = String(c.bg || '').replace('#', '');
        if (hex.length === 6) {
          var lum = (parseInt(hex.slice(0, 2), 16) * 299 + parseInt(hex.slice(2, 4), 16) * 587 + parseInt(hex.slice(4, 6), 16) * 114) / 255000;
          html.setAttribute('data-theme', lum > 0.5 ? 'light' : 'dark');
        }
      }
      if (t && t.density && t.density !== 'comfortable') html.setAttribute('data-density', t.density);
      if (t && t.textSize === '125') html.setAttribute('data-text-size', '125');
      if (t && t.frosted) html.setAttribute('data-frosted', '');
    } catch (e) { /* a broken theme in storage is not worth a white screen */ }
    // The browser paints the page background before any stylesheet arrives.
    if (!bg) {
      var dark = html.getAttribute('data-theme');
      if (!dark) dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      bg = dark === 'light' ? '#f7f6f3' : '#0c0d0f';
    }
    html.style.backgroundColor = bg;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', bg);
  })();
  </script>
</head>
<body>
  <div id="studio-root"></div>
  <!--
    The whole interface. One entry; the stylesheet carries a content hash in
    its name and the entry injects it itself (studio/src/main.tsx), so a
    second <link> to the same file under a different URL is not needed — that
    is how the cascade once ended up with two copies of every rule.
  -->
  <script type="module" src="/static/studio/studio.js?v={{ASSET_V:studio/studio.js}}"></script>
  <script nonce="{{CSP_NONCE}}">if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js').catch(function(){});}</script>
</body>
</html>
